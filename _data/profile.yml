short_bio: >-
  <p>
  I am a Computer Science student at Yonsei University and an AI Research Intern at a Severance Hospital Subsidiary.
  </p>
  <p>
  My research focuses on building reliable and auditable AI systems, particularly LLM-based agents operating in high-stakes environments. I am interested in AI provenance, trustworthy agent architectures, and domain-adapted language models with applications in scientific and clinical discovery. My interdisciplinary background in computer science and German language and literature informs my focus on language, reasoning, and human-AI collaboration.
  I genuinely hope to contribute to innovative projects.
  </p>

