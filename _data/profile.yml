research_experience:
  - title: AI Research Intern, NewCureM (Severance Hospital Subsidiary), Seoul, Korea
    date: Mar 2026 – Present
    abstract: >-
      • Conducting research on reliable medical imaging and clinical NLP pipelines under the supervision of Yonsei University College of Medicine faculty.<br>
      • Developed a region-aware deep learning model for multi-class neurodegenerative disease classification using brain FDG-PET imaging, leveraging normative modeling and voxel-wise metabolic deviation maps (Z-maps) to capture disease-specific regional patterns (achieving 87.2% accuracy and 84.8% balanced accuracy on a held-out cohort of 755 cases).<br>
      • Developed an automated natural language radiology report generation system, combining domain-adapted LLM instruction-tuning with deterministic rendering of structured fields to improve clinical consistency, receiving highly positive feedback from radiologists.<br>
      • Developing a Korean synthetic EHR generation framework based on Synthea, targeting interoperability with the KR Core FHIR standard.

  - title: Team Leader, Hangul-Aware LLM Watermarking Project, Yonsei University
    date: Aug 2025 – Dec 2025
    abstract: >-
      • Designed a Hangul-aware watermark embedding algorithm for open-source LLMs, leveraging the structural properties of Korean grapheme composition.<br>
      • Explored watermark encoding and detection mechanisms based on Hangul decomposition (choseong, jungseong, and jongseong), targeting robustness against paraphrasing while preserving text naturalness.<br>
      • Led the end-to-end experimental pipeline, including open-source LLM fine-tuning, statistical detectability evaluation, and perplexity-based quality assessment.
    # link:
    #  url: https://github.com/mirulili/3Ch-Jamo-Watermark
